# Builds the JupyterLite site and publishes it on GitHub Pages.
# In the repo: Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# Generated - master: C:\deploy\sitecontrol\lite\shared\.github\workflows\deploy.yml
name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      # one artifact name per run attempt: a re-run would otherwise leave two artifacts
      # called github-pages in the run, and deploy-pages refuses to choose
      artifact: github-pages-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the build tools
        run: python -m pip install -r requirements.txt
      - name: Build the JupyterLite site
        run: |
          # Browsers keep their own copy of every notebook that was opened, which hides newer
          # versions from the site. A storage name per deployment makes each deployment start fresh.
          # It starts with the site's appName (jupyter-lite.json), so sites don't share storage.
          python -c "import json,os; p='jupyter-lite.json'; c=json.load(open(p)); d=c['jupyter-config-data']; d['contentsStorageName']=d.get('appName',os.environ['GITHUB_REPOSITORY'])+' '+os.environ['GITHUB_SHA'][:8]; json.dump(c,open(p,'w'),indent=2)"
          jupyter lite build
          # the site's own front page (e.g. opens pakstart.ipynb in the Notebook interface
          # instead of JupyterLab), if it has one
          if [ -f overrides/index.html ]; then cp overrides/index.html dist/index.html; fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # from the build job, so "Re-run failed jobs" (deploy only) still finds it
          artifact_name: ${{ needs.build.outputs.artifact }}
