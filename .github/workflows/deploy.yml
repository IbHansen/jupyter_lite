# Builds the JupyterLite site and publishes it on GitHub Pages.
# In the repo: Settings -> Pages -> Build and deployment -> Source: GitHub Actions
name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the build tools
        run: python -m pip install -r requirements.txt
      - name: Build the JupyterLite site
        run: |
          jupyter lite build
          # front page opens start.ipynb in the Notebook interface instead of JupyterLab
          cp overrides/index.html dist/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
